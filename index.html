<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRESTAL Order Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 20px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 2px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .field-group label {
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        .field-group input[type="text"],
        .field-group input[type="number"],
        .field-group input[type="datetime-local"],
        .field-group textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            direction: rtl;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .radio-group-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Styling radio buttons as rectangular boxes */
        .custom-radio {
            position: relative;
            flex: 1;
        }

        .custom-radio input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .custom-radio label {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-color: #e9ecef;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }

        .custom-radio input[type="radio"]:checked + label {
            background-color: #000;
            color: #fff;
            border-color: #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .custom-radio label:hover {
            border-color: #666;
        }

        .notes-group {
            margin-bottom: 20px;
        }

        .notes-group label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .notes-group textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <form id="orderForm">
        <!-- Header -->
        <div class="header">
            <div class="brand-name">CRESTAL</div>
        </div>

        <!-- Name & Phone -->
        <div class="row">
            <div class="field-group">
                <label>الاسم:</label>
                <input type="text" id="customer_name" required>
            </div>
            <div class="field-group">
                <label>رقم التليفون:</label>
                <input type="text" id="phone" required>
            </div>
        </div>

        <!-- 1. Color Selection Group (Choose 1) -->
        <div class="section-title">نوع الطباعة:</div>
        <div class="radio-group-container">
            <div class="custom-radio">
                <input type="radio" id="black_white" name="color_type" value="اسود">
                <label for="black_white">اسود</label>
            </div>
            <div class="custom-radio">
                <input type="radio" id="color" name="color_type" value="ألوان">
                <label for="color">ألوان</label>
            </div>
        </div>

        <!-- 2. Page Type Group (Choose 1) -->
        <div class="section-title">نوع الصفحة / الطباعة:</div>
        <div class="radio-group-container">
            <div class="custom-radio">
                <input type="radio" id="single_side" name="page_type" value="وجه واحد">
                <label for="single_side">وجه واحد</label>
            </div>
            <div class="custom-radio">
                <input type="radio" id="double_side" name="page_type" value="وجهين">
                <label for="double_side">وجهين</label>
            </div>
            <div class="custom-radio">
                <input type="radio" id="booklet" name="page_type" value="بوكليت">
                <label for="booklet">بوكليت</label>
            </div>
        </div>

        <!-- 3. Finishing Group (Choose 1) -->
        <div class="section-title">الإنهاء والتقفيل:</div>
        <div class="radio-group-container">
            <div class="custom-radio">
                <input type="radio" id="stapling" name="finishing_type" value="تدبيس">
                <label for="stapling">تدبيس</label>
            </div>
            <div class="custom-radio">
                <input type="radio" id="binding" name="finishing_type" value="تجليد">
                <label for="binding">تجليد</label>
            </div>
        </div>

        <!-- Number of Copies -->
        <div class="row">
            <div class="field-group">
                <label>عدد النسخ:</label>
                <input type="number" id="copies_count" min="1" placeholder="1" required>
            </div>
        </div>

        <!-- Delivery & Receiver -->
        <div class="row">
            <div class="field-group">
                <label>ميعاد التسليم:</label>
                <input type="datetime-local" id="delivery_time" required>
            </div>
            <div class="field-group">
                <label>المستلم:</label>
                <input type="text" id="receiver">
            </div>
        </div>

        <!-- Notes -->
        <div class="notes-group">
            <label>ملاحظات</label>
            <textarea id="notes"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">إرسال البيانات</button>
        <div id="status-msg"></div>
    </form>
</div>

<script>
    // Replace this URL with your Google Apps Script Web App URL
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    document.getElementById("orderForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const statusMsg = document.getElementById("status-msg");

        submitBtn.disabled = true;
        statusMsg.innerText = "جاري إرسال البيانات...";
        statusMsg.style.color = "blue";

        // Helper function to get value of selected radio button in a group
        const getSelectedRadioValue = (name) => {
            const selected = document.querySelector(`input[name="${name}"]:checked`);
            return selected ? selected.value : "";
        };

        const formData = {
            customer_name: document.getElementById("customer_name").value,
            phone: document.getElementById("phone").value,
            color_type: getSelectedRadioValue("color_type"),
            page_type: getSelectedRadioValue("page_type"),
            finishing_type: getSelectedRadioValue("finishing_type"),
            copies_count: document.getElementById("copies_count").value || 1,
            delivery_time: document.getElementById("delivery_time").value,
            receiver: document.getElementById("receiver").value,
            notes: document.getElementById("notes").value
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        })
        .then(() => {
            statusMsg.innerText = "تم حفظ البيانات بنجاح!";
            statusMsg.style.color = "green";
            document.getElementById("orderForm").reset();
            submitBtn.disabled = false;
        })
        .catch(error => {
            statusMsg.innerText = "حدث خطأ أثناء الإرسال.";
            statusMsg.style.color = "red";
            submitBtn.disabled = false;
            console.error("Error!", error.message);
        });
    });
</script>

</body>
</html>
